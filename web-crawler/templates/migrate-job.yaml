apiVersion: batch/v1
kind: Job
metadata:
  # 💡 Append the image tag to the name so the resource name changes on every deployment.
  # This tricks Kubernetes into treating it as a brand new Job every time you update your app.
  name: {{ .Release.Name }}-migrate-{{ .Values.image.tag | replace "." "-" | default "latest" }}
  namespace: {{ .Release.Namespace | default "crawler" }}
  annotations:
    # --- Helm Hooks ---
    # Tells Helm to spin up this job right before installing or upgrading the rest of the application
    "helm.sh/hook": pre-install,pre-upgrade
    # Tells Helm to delete the old migration job execution artifacts right before running the new one
    "helm.sh/hook-delete-policy": before-hook-creation
    
    # --- ArgoCD Sync Hooks ---
    # Tells ArgoCD to execute this job during the PreSync stage before touching the API or Workers
    "argocd.argoproj.io/hook": PreSync
    # Tells ArgoCD to automatically clean up the old job definition from the cluster cache
    "argocd.argoproj.io/hook-delete-policy": BeforeHookCreation
spec:
  # Optional: Automatically cleans up completed/failed jobs after 300 seconds to keep things tidy
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app: migrate
    spec:
      # Changing this to OnFailure is highly recommended for migration jobs. 
      # If Postgres takes a second to accept connections, the pod will restart instead of bricking the whole Job.
      restartPolicy: OnFailure 
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["crawler-db-migrate"]
          envFrom:
            - secretRef:
                name: {{ .Release.Name }}-crawler-env