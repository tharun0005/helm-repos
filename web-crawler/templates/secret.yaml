apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-crawler-env
  namespace: crawler
type: Opaque # FIXED: Aligned correctly with apiVersion, kind, and metadata
stringData:
  DATABASE_URL: {{ .Values.appEnv.DATABASE_URL | quote }}
  REDIS_URL: {{ .Values.appEnv.REDIS_URL | quote }}
  CRAWL_DATA_DIR: {{ .Values.appEnv.CRAWL_DATA_DIR | quote }}
  SCRAPE_DATA_DIR: {{ .Values.appEnv.SCRAPE_DATA_DIR | quote }}
  RQ_DEFAULT_TIMEOUT: {{ .Values.appEnv.RQ_DEFAULT_TIMEOUT | quote }}
  API_BASE_URL: {{ .Values.appEnv.API_BASE_URL | quote }}
  QDRANT_URL: {{ .Values.appEnv.QDRANT_URL | quote }}
  QDRANT_COLLECTION: {{ .Values.appEnv.QDRANT_COLLECTION | quote }}
  LITELLM_BASE_URL: {{ .Values.appEnv.LITELLM_BASE_URL | quote }}
  OPENAI_API_KEY: {{ .Values.appEnv.OPENAI_API_KEY | quote }}
  EMBEDDING_MODEL: {{ .Values.appEnv.EMBEDDING_MODEL | quote }}
  PLAYWRIGHT_TIMEOUT_MS: {{ .Values.appEnv.PLAYWRIGHT_TIMEOUT_MS | quote }}
  SCRAPE_CONCURRENCY: {{ .Values.appEnv.SCRAPE_CONCURRENCY | quote }}
  SCRAPE_IO_WORKERS: {{ .Values.appEnv.SCRAPE_IO_WORKERS | quote }}
  SCRAPE_EMBED_WORKERS: {{ .Values.appEnv.SCRAPE_EMBED_WORKERS | quote }}
  SCRAPE_MAX_RETRIES: {{ .Values.appEnv.SCRAPE_MAX_RETRIES | quote }}
  QDRANT_API_KEY: {{ .Values.appEnv.QDRANT_API_KEY | quote }}