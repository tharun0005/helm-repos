apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      initContainers:
        - name: wait-for-api
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -w 2 api 8000; do echo "waiting for api..."; sleep 2; done;']
          # --- ADD THIS BLOCK TO GIVE INIT CONTAINER ROOT ACCESS ---
          securityContext:
            runAsUser: 0        # Overrides the pod default to run as root
            runAsGroup: 0
            allowPrivilegeEscalation: true
          # --------------------------------------------------------
      securityContext:
        runAsUser: 999      # Runs the main container as your image's appuser (UID 999)
        runAsGroup: 999     # Runs the main container processes as appgroup (GID 999)
        fsGroup: 999        # Correctly handles the volume mounts
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh", "/app/scripts/run-worker.sh"]
          volumeMounts:
            - name: shared-data
              mountPath: /app/data
          envFrom:
            - secretRef:
                name: {{ .Release.Name }}-crawler-env
      volumes:
        - name: shared-data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-data-pvc