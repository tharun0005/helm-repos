# Shared Data PV (Used by API and Worker)
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ .Release.Name }}-data-pv
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteMany
  storageClassName: manual # 1. ADD THIS LINE
  hostPath:
    path: "{{ .Values.global.hostMountPath }}/shared-data"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-data-pvc
  namespace: crawler        # 2. ADD THIS TO MATCH YOUR PODS
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: manual # 3. ADD THIS LINE
  resources:
    requests:
      storage: 5Gi
  volumeName: {{ .Release.Name }}-data-pv
---
# Postgres Local Host Volume
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ .Release.Name }}-pg-pv
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  storageClassName: manual # (Keep this, it's correct)
  hostPath:
    path: "{{ .Values.global.hostMountPath }}/postgres"
---
# Qdrant Local Host Volume
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ .Release.Name }}-qdrant-pv
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  storageClassName: manual # (Keep this, it's correct)
  hostPath:
    path: "{{ .Values.global.hostMountPath }}/qdrant"