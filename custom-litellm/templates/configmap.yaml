apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-litellm-config
data:
  config.yaml: |
    litellm_settings:
      set_verbose: true
      json_logs: false
      request_timeout: 600
      num_retries: 3
      drop_params: true

    model_list:

      # ==============================
      # 🔹 EMBEDDING MODELS
      # ==============================

      - model_name: All-MiniLM-L6-v2
        litellm_params:
          model: huggingface/sentence-transformers/all-MiniLM-L6-v2
          api_key: os.environ/HF_TOKEN
        model_info:
          mode: embedding
          provider: "huggingface"

      - model_name: All-mpnet-base-v2
        litellm_params:
          model: huggingface/sentence-transformers/all-mpnet-base-v2
          api_key: os.environ/HF_TOKEN
        model_info:
          mode: embedding
          provider: "huggingface"

      - model_name: Qwen-Embedding
        litellm_params:
          model: huggingface/Qwen/Qwen3-Embedding-0.6B
          api_key: os.environ/HF_TOKEN
        model_info:
          mode: embedding
          provider: "huggingface"
      
      # - model_name: embeddinggemma
      #   litellm_params:
      #     model: ollama/embeddinggemma:latest
      #     api_base: os.environ/OLLAMA_API_BASE
      #   model_info:
      #     mode: embedding
      #     provider: "ollama"
      
      - model_name: nvidia-embed-passage
        litellm_params:
          model: nvidia_nim/nvidia/llama-nemotron-embed-vl-1b-v2
          api_key: os.environ/NVIDIA_API_KEY
          api_base: os.environ/NVIDIA_API_BASE
          input_type: passage
        model_info:
          mode: embedding
          provider: "nvidia_nim"

      - model_name: nvidia-embed-query
        litellm_params:
          model: nvidia_nim/nvidia/llama-nemotron-embed-vl-1b-v2
          api_key: os.environ/NVIDIA_API_KEY
          api_base: os.environ/NVIDIA_API_BASE
          input_type: query
        model_info:
          mode: embedding
          provider: "nvidia_nim"


      # ==============================
      # 🔹 CHAT MODELS (ROUTED)
      # ==============================

      - model_name: llama-3.3-70b-versatile
        litellm_params:
          model: groq/llama-3.3-70b-versatile
          api_key: os.environ/GROQ_API_KEY
        model_info:
          mode: chat
          provider: "groq"
          supports_streaming: true
        rpm: 120
        tpm: 20000000

      - model_name: Gpt-oss-120b
        litellm_params:
          model: groq/openai/gpt-oss-120b
          api_key: os.environ/GROQ_API_KEY
        model_info:
          mode: chat
          provider: "groq"
          supports_streaming: true
        rpm: 120
        tpm: 20000000

      - model_name: llama-3.1-8b-instant
        litellm_params:
          model: groq/llama-3.1-8b-instant
          api_key: os.environ/GROQ_API_KEY
        model_info:
          mode: chat
          provider: "groq"
          supports_streaming: true
        rpm: 300
        tpm: 5000000

      - model_name: Qwen3-32b
        litellm_params:
          model: groq/qwen/qwen3-32b
          api_key: os.environ/GROQ_API_KEY
        model_info:
          mode: chat
          provider: "groq"
          supports_streaming: true
        rpm: 180
        tpm: 15000000

      # - model_name: Gpt-Oss-Cloud
      #   litellm_params:
      #     model: ollama_chat/gpt-oss:20b-cloud
      #     api_base: os.environ/OLLAMA_API_BASE
      #     stream: true
      #   model_info:
      #     mode: chat
      #     provider: "ollama"
      #     supports_streaming: true

      # - model_name: Gpt-Oss-120b-Cloud
      #   litellm_params:
      #     model: ollama_chat/gpt-oss:120b-cloud
      #     api_base: os.environ/OLLAMA_API_BASE
      #     stream: true
      #   model_info:
      #     mode: chat
      #     provider: "ollama"
      #     supports_streaming: true

      # - model_name: Kimi-K2.5-Cloud
      #   litellm_params:
      #     model: ollama_chat/kimi-k2.5:cloud
      #     api_base: os.environ/OLLAMA_API_BASE
      #     stream: true
      #   model_info:
      #     mode: chat
      #     provider: "ollama"
      #     supports_streaming: true

      # - model_name: GLM-5.1-Cloud
      #   litellm_params:
      #     model: ollama_chat/glm-5.1:cloud
      #     api_base: os.environ/OLLAMA_API_BASE
      #     stream: true
      #   model_info:
      #     mode: chat
      #     provider: "ollama"
      #     supports_streaming: true

      - model_name: Minimax-M2.7-NVIDIA
        litellm_params:
          model: nvidia_nim/minimaxai/minimax-m2.7
          api_base: os.environ/NVIDIA_API_BASE
          api_key: os.environ/NVIDIA_API_KEY
          stream: true
        model_info:
          mode: chat
          provider: "nvidia_nim"
          supports_streaming: true

      - model_name: GLM-5.1-NVIDIA
        litellm_params:
          model: nvidia_nim/z-ai/glm-5.1
          api_base: os.environ/NVIDIA_API_BASE
          api_key: os.environ/NVIDIA_API_KEY
          stream: true
        model_info:
          mode: chat
          provider: "nvidia_nim"
          supports_streaming: true

      # ==============================
      # 🔹 VISION MODELS
      # ==============================

      - model_name: groq-vision
        litellm_params:
          model: groq/meta-llama/llama-4-scout-17b-16e-instruct
          api_key: os.environ/GROQ_API_KEY
        model_info:
          mode: vision
          provider: "groq"
          supports_streaming: true


    # =====================================
    # 🔹 ROUTER SETTINGS (CHAT ONLY)
    # =====================================

    router_settings:
      redis_host: os.environ/REDIS_HOST
      redis_port: os.environ/REDIS_PORT
      redis_password: os.environ/REDIS_PASSWORD
      cache_responses: true
      routing_strategy: "simple-shuffle"

      model_group_alias:
        relation_extraction: "llama-3.3-70b-versatile,Gpt-oss-120b,llama-3.1-8b-instant,Qwen3-32b,Minimax-M2.7-NVIDIA,GLM-5.1-NVIDIA"

      fallbacks:

        # 🔹 IMPORTANT: Embeddings must have empty fallback groups
        - "All-MiniLM-L6-v2": []
        - "All-mpnet-base-v2": []
        - "Qwen-Embedding": []
        # - "embeddinggemma": []
        - "nvidia-embed-passage": []
        - "nvidia-embed-query": []

        # 🔹 Vision Models (No Fallbacks)
        - "groq-vision": []

        # 🔹 Chat fallbacks
        - "llama-3.3-70b-versatile": ["Gpt-oss-120b", "llama-3.1-8b-instant", "Qwen3-32b"]
        - "Gpt-oss-120b": ["llama-3.3-70b-versatile", "llama-3.1-8b-instant", "Qwen3-32b"]
        - "llama-3.1-8b-instant": ["Qwen3-32b"]
        - "Qwen3-32b": ["llama-3.3-70b-versatile"]
        - "Minimax-M2.7-NVIDIA": ["GLM-5.1-NVIDIA", "llama-3.3-70b-versatile", "Gpt-oss-120b"]
        - "GLM-5.1-NVIDIA": ["Minimax-M2.7-NVIDIA", "llama-3.3-70b-versatile", "Gpt-oss-120b"]


    # =====================================
    # 🔹 GENERAL SETTINGS
    # =====================================

    general_settings:
      master_key: os.environ/MASTER_KEY
      store_model_in_db: true
      database_url: os.environ/DATABASE_URL